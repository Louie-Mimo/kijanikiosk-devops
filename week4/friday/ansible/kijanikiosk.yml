---
- name: Configure KijaniKiosk servers
  hosts: kijanikiosk
  become: true
  become_method: sudo
  force_handlers: true

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true
      notify:
        -Restart service

    - name: Restart service
      ansible.builtin.systemd:
        name: "{{ service_name }}.service"
        state: restarted
      when: service_name is defined

    - name: Restart journald
      ansible.builtin.systemd:
        name: systemd-journald
        state: restarted

  tasks:

    # ---------- PHASE 1: PACKAGES ----------
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install required packages
      ansible.builtin.apt:
        name:
          - nginx
          - nodejs
          - ufw
          - acl
        state: present
        install_recommends: false

    # ---------- PHASE 2: SERVICE ACCOUNTS ----------
    - name: Create kijanikiosk system group
      ansible.builtin.group:
        name: "{{ service_group }}"
        system: true
        state: present

    - name: Create service account
      ansible.builtin.user:
        name: "{{ service_name }}"
        system: true
        shell: /usr/sbin/nologin
        create_home: false
        groups: "{{ service_group }}"
        append: true
        state: present

    # ---------- PHASE 3: DIRECTORIES ----------
    - name: Create application directory tree
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ item.owner }}"
        group: "{{ item.group }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "/opt/kijanikiosk/{{ service_name | replace('kk-','') }}"
          owner: "{{ service_name }}"
          group: "{{ service_name }}"
          mode: "0750"

        - path: "/opt/kijanikiosk/config"
          owner: root
          group: kijanikiosk
          mode: "0750"

        - path: "{{ log_dir }}"
          owner: "{{ service_name }}"
          group: "{{ service_name }}"
          mode: "2770"

    # ---------- PHASE 4: SYSTEMD ----------
    - name: Deploy systemd unit file
      ansible.builtin.template:
        src: templates/service.unit.j2
        dest: "/etc/systemd/system/{{ service_name }}.service"
        owner: root
        group: root
        mode: "0644"
      notify:
        - Reload systemd
        - Restart service

    - name: Enable service
      ansible.builtin.systemd:
        name: "{{ service_name }}.service"
        enabled: true
        state: started

    # ---------- PHASE 5: FIREWALL ----------
    - name: Set UFW default deny incoming
      community.general.ufw:
        state: enabled
        default: deny
        direction: incoming

    - name: Allow SSH
      community.general.ufw:
        rule: allow
        port: "22"
        proto: tcp

    - name: Allow service port
      community.general.ufw:
        rule: allow
        direction: in
        interface: lo
        port: "{{ service_port }}"
        proto: tcp

    # ---------- PHASE 6: JOURNAL ----------
    - name: Create persistent journal directory
      ansible.builtin.file:
        path: /var/log/journal
        state: directory
        owner: root
        group: systemd-journal
        mode: "0755"
      notify:
        - Restart journald
      
    # ---------- PHASE 7: LOGROTATE ----------
    - name: Deploy logrotate configuration
      ansible.builtin.template:
        src: templates/logrotate.j2
        dest: /etc/logrotate.d/kijanikiosk
        owner: root
        group: root
        mode: "0644"
