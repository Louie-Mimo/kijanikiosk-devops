apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kijani-ingress
  namespace: kijani-project
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"

spec:
  ingressClassName: nginx

  rules:
    - host: kijani.local
      http:
        paths:
          - path: /payments(/|$)(.+)
            pathType: ImplementationSpecific
            backend:
              service:
                name: kk-payments
                port:
                  number: 3001

          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: kk-api
                port:
                  number: 8080

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kijani-payments-root
  namespace: kijani-project
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /health
    nginx.ingress.kubernetes.io/use-regex: "true"

spec:
  ingressClassName: nginx

  rules:
    - host: kijani.local
      http:
        paths:
          - path: /payments/?$
            pathType: ImplementationSpecific
            backend:
              service:
                name: kk-payments
                port:
                  number: 3001
