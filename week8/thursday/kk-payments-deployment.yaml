apiVersion: apps/v1
kind: Deployment
metadata:
  name: kk-payments
  labels:
    app: kk-payments

spec:
  replicas: 2

  selector:
    matchLabels:
      app: kk-payments

  strategy:
    type: RollingUpdate

  template:
    metadata:
      labels:
        app: kk-payments

    spec:
      imagePullSecrets:
        - name: kijani-registry-credentials

      containers:
        - name: kk-payments
          image: ghcr.io/louie-mimo/kk-payments:v1.0.0-72d94ad
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 3001
              protocol: TCP

          env:
            - name: APP_VERSION
              value: "v1.0.0-72d94ad"

          resources:
            requests:
              cpu: "100m"
              memory: "64Mi"
            limits:
              cpu: "1"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 3001
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
